apiVersion: apps/v1
kind: Deployment
metadata:
  name: lesson22-app
  labels:
    app: lesson22-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lesson22-app
  template:
    metadata:
      labels:
        app: lesson22-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 8080
          command:
            - /bin/sh
            - -c
            - |
              sed -i 's/listen       80;/listen       8080;/' /etc/nginx/conf.d/default.conf
              nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
